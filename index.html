<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team 18833 — Megiddo Lions</title>
<meta name="description" content="FIRST Tech Challenge Team 18833 Megiddo Lions — Megiddo Regional Council, Israel. Auto-updated from DATA.md." />
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #121a2b;
    --panel-2: #182338;
    --text: #e8edf7;
    --muted: #93a1b8;
    --gold: #f5b83d;
    --gold-2: #ffd97a;
    --accent: #4da3ff;
    --line: #263450;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1a2b4a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    min-height: 100vh;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Hero */
  header.hero {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 28px; background: linear-gradient(135deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line); border-radius: 18px;
  }
  .logo-badge {
    width: 110px; height: 110px; border-radius: 26px; flex: 0 0 auto;
    background: linear-gradient(145deg, #2a1c05, #4a3008);
    border: 2px solid var(--gold);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; box-shadow: 0 6px 24px rgba(245, 184, 61, .25);
  }
  .logo-badge .num { font-size: 30px; color: var(--gold-2); letter-spacing: 1px; }
  .logo-badge .lion { font-size: 34px; line-height: 1.1; }
  .hero h1 { font-size: clamp(26px, 5vw, 40px); letter-spacing: .5px; }
  .hero h1 .gold { color: var(--gold); }
  .hero .sub { color: var(--muted); margin-top: 4px; }
  .hero .updated { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .hero .updated b { color: var(--gold-2); font-weight: 600; }

  section { margin-top: 28px; }
  h2 {
    font-size: 20px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px;
  }

  /* Profile grid */
  .profile { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .profile .cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .profile .k { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .profile .v { font-size: 16px; font-weight: 600; margin-top: 2px; }

  /* Links */
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: 14px;
  }
  .links a:hover { border-color: var(--gold); color: var(--gold-2); text-decoration: none; }

  /* Achievements timeline */
  .ach { display: grid; gap: 12px; }
  .ach .item { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .ach .year { flex: 0 0 64px; font-weight: 800; color: var(--gold-2); font-size: 18px; }
  .ach .txt { color: var(--text); }
  .ach .txt strong { color: var(--gold-2); }

  /* Seasons */
  .season { margin-bottom: 16px; }
  .season h3 { color: var(--gold-2); font-size: 17px; margin-bottom: 6px; }
  .season .record { color: var(--accent); font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .chip.award { border-color: var(--gold); color: var(--gold-2); }
  .chip.rank { color: var(--accent); }
  .none { color: var(--muted); font-size: 14px; }

  footer { margin-top: 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 18px; }
  footer b { color: var(--text); }
  .error { border-color: #b3413f; background: #2a1414; color: #ffb4b2; padding: 16px; border-radius: 12px; }
  .skeleton { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo-badge" id="logo" title="Megiddo Lions">
      <div class="lion">🦁</div>
      <div class="num">18833</div>
    </div>
    <div>
      <h1>Megiddo <span class="gold">Lions</span></h1>
      <div class="sub" id="hero-sub">FIRST Tech Challenge · Israel</div>
      <div class="updated" id="updated">Loading data from DATA.md…</div>
    </div>
  </header>

  <main id="content"><p class="skeleton">Parsing DATA.md…</p></main>

  <footer id="footer">
    Data source: <b>DATA.md</b> — auto-updated weekly by GitHub Actions from FIRST's official
    FTC event pages. Website served by GitHub Pages. First Israel · FIRST Tech Challenge.
  </footer>
</div>

<script>
/* ============================================================
   Megiddo Lions website — renders everything from DATA.md.
   DATA.md is the single source of truth (kept auto-updated by
   update_team_data.py + GitHub Actions). No data is hard-coded
   here; the parser below must stay compatible with DATA.md's
   section structure (see instructions in DATA.md §1).
   ============================================================ */

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function mdInline(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function section(md, startHeading, nextHeadingRe) {
  const start = md.indexOf(startHeading);
  if (start === -1) return "";
  let rest = md.slice(start + startHeading.length);
  if (nextHeadingRe) {
    const m = rest.match(nextHeadingRe);
    if (m) rest = rest.slice(0, m.index);
  }
  return rest;
}

/* Parse the auto-generated live block (identity + season history). */
function parseLiveBlock(md) {
  const m = md.match(/<!--\s*BEGIN LIVE TEAM DATA[\s\S]*?([\s\S]*?)<!--\s*END LIVE TEAM DATA/);
  if (!m) return null;
  const block = m[1];

  const identity = {};
  const idPart = block.split("### Season history")[0];
  idPart.split("\n").forEach((line) => {
    const kv = line.match(/^([A-Za-z ]+):\s*(.+)$/);
    if (kv) identity[kv[1].trim()] = kv[2].trim();
  });

  const seasons = [];
  const histPart = block.split("### Season history")[1] || "";
  histPart.split(/^#### /m).slice(1).forEach((chunk) => {
    const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
    const head = lines[0].match(/^(\d{4})\s*[—-]\s*(.+)$/);
    const season = { year: head ? head[1] : "?", game: head ? head[2] : "?", record: null, ranks: [], awards: [] };
    lines.slice(1).forEach((line) => {
      let mm;
      if ((mm = line.match(/^Record:\s*(.+)$/))) season.record = mm[1];
      else if ((mm = line.match(/^Event:\s*(.+?)\s*[—-]\s*quals rank\s*(\d+)\s*of\s*(\d+)$/)))
        season.ranks.push({ event: mm[1], rank: +mm[2], of: +mm[3] });
      else if ((mm = line.match(/^Award:\s*(.+?)\s*[—-]\s*(.+)$/)))
        season.awards.push({ name: mm[1], event: mm[2] });
    });
    seasons.push(season);
  });
  return { identity, seasons };
}

/* Parse §3 logo/source links table. */
function parseLinks(md) {
  const sec = section(md, "## 3. Logo links", /^## /m);
  const links = [];
  sec.split("\n").forEach((line) => {
    const cells = line.split("|").map((c) => c.trim());
    if (cells.length < 4 || /^-+$/.test(cells[1] || "-")) return;
    const linkMatch = (cells[2] || "").match(/\[([^\]]+)\]\((https?:[^)]+)\)/) || (cells[2] || "").match(/(https?:\S+)/);
    if (linkMatch) links.push({ label: cells[1], url: linkMatch[2] || linkMatch[1] });
  });
  return links;
}

/* Parse §4 achievements bullets into (year, text) cards. */
function parseAchievements(md) {
  const sec = section(md, "## 4. Achievements", /^## /m);
  const items = [];
  sec.split("\n").forEach((line) => {
    const t = line.trim();
    if (!t.startsWith("- ")) return;
    const mm = t.slice(2).match(/^\*\*(.+?)\*\*\s*[—-]\s*(.+)$/);
    if (mm) items.push({ year: mm[1].replace(/\*/g, ""), text: mm[2] });
    else items.push({ year: "", text: t.slice(2) });
  });
  return items;
}

function render(data, links, achievements) {
  const id = data.identity;
  const cur = data.seasons[0] || {};

  document.getElementById("updated").innerHTML =
    id["Data updated"] ? `Data updated: <b>${esc(id["Data updated"])}</b> · auto-refreshed weekly` : "";

  const sub = [`FIRST Tech Challenge · ${esc(id["Region"] || "Israel")}`,
               `Rookie year ${esc(id["Rookie year"] || "?")}`,
               esc(cur.year ? `${cur.year} “${cur.game}”` : "")].filter(Boolean).join(" · ");
  document.getElementById("hero-sub").textContent = sub;

  const profileRows = [
    ["Team number", id["Number"]], ["Team name", id["Name"]],
    ["School / org", id["Organization"]], ["Location", id["Location"]],
    ["Country", id["Country"]], ["FIRST region", id["Region"]],
    ["Rookie year", id["Rookie year"]], ["Current season", cur.year ? `${cur.year} — ${cur.game}` : ""],
    ["Sponsors", id["Sponsors"]],
  ];
  const profile = `<section><h2>Team profile</h2><div class="profile">` +
    profileRows.filter(([, v]) => v).map(([k, v]) =>
      `<div class="cell"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("") +
    `</div></section>`;

  const linksHtml = links.length
    ? `<section><h2>Logo &amp; official links</h2><div class="links">` +
      links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("") +
      `</div></section>`
    : "";

  const achHtml = achievements.length
    ? `<section><h2>Achievements — season by season</h2><div class="ach">` +
      achievements.map((a) =>
        `<div class="item"><div class="year">${esc(a.year)}</div><div class="txt">${mdInline(a.text)}</div></div>`).join("") +
      `</div></section>`
    : "";

  const seasonsHtml = data.seasons.length
    ? `<section><h2>Season records &amp; awards <span style="font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0">(auto-updated)</span></h2>` +
      data.seasons.map((s) => {
        const chips = [
          ...s.ranks.map((r) => `<span class="chip rank" title="${esc(r.event)}">${esc(r.event)} — quals rank ${r.rank}/${r.of}</span>`),
          ...s.awards.map((a) => `<span class="chip award" title="${esc(a.event)}">🏆 ${esc(a.name)} — ${esc(a.event)}</span>`),
        ];
        return `<div class="season card"><h3>${esc(s.year)} — ${esc(s.game)}</h3>` +
          (s.record ? `<div class="record">${esc(s.record)}</div>` : `<div class="none">No official events</div>`) +
          (chips.length ? `<div class="chips">${chips.join("")}</div>` : "") +
          `</div>`;
      }).join("") + `</section>`
    : "";

  document.getElementById("content").innerHTML = profile + linksHtml + achHtml + seasonsHtml;
}

async function main() {
  const content = document.getElementById("content");
  try {
    const res = await fetch("DATA.md", { cache: "no-store" });
    if (!res.ok) throw new Error("DATA.md fetch failed: HTTP " + res.status);
    const md = await res.text();

    const data = parseLiveBlock(md);
    if (!data || !data.identity["Number"]) throw new Error("Could not find the live team data block in DATA.md");

    const links = parseLinks(md);
    const achievements = parseAchievements(md);
    render(data, links, achievements);
  } catch (err) {
    content.innerHTML = `<div class="error"><b>Could not load DATA.md.</b><br>${esc(String(err.message || err))}<br><br>
      If you opened this file directly (file://), serve it instead: <code>python3 -m http.server 8000</code> → http://localhost:8000</div>`;
  }
}
main();
</script>
</body>
</html>
