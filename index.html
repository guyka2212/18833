<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Megiddo Lions — FTC 18833</title>
<meta name="description" content="Megiddo Lions, FIRST Tech Challenge team 18833. Megiddo Regional Council, Israel. Team record, awards and season history, kept current from DATA.md." />
<meta name="theme-color" content="#F7F5F0" />
<link rel="icon" type="image/png" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------
     Megiddo Lions — team site
     Single accent color, editorial layout, tabular data.
     All content is parsed from DATA.md at runtime (see script
     at the bottom of this file). Nothing here is hard-coded.
     ------------------------------------------------------------ */
  :root {
    --paper: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #171310;
    --muted: #6E675C;
    --line: #DCD6C9;
    --line-strong: #171310;
    --accent: #B23A17;
    --accent-ink: #8A2C10;
    --maxw: 1040px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Nothing may ever paint past the viewport edge (clip does not break
     position: sticky, unlike overflow: hidden). */
  html, body { max-width: 100%; overflow-x: clip; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--ink); color: var(--paper); }

  a { color: inherit; }
  a:hover { color: var(--accent); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  /* Content column centered on large screens; symmetric padding keeps
     it off both edges on small screens. */
  @media (min-width: 821px) { .wrap { padding: 0 32px; } }
  @media (max-width: 480px) { .wrap { padding: 0 16px; } }

  /* ---------- header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .site-header .wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding-top: 14px; padding-bottom: 14px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-weight: 900; letter-spacing: .02em; text-transform: uppercase;
    text-decoration: none; font-size: 15px;
  }
  .wordmark img { width: 30px; height: 30px; object-fit: cover; border: 1px solid var(--line-strong); }
  .site-nav { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
  .site-nav a {
    text-decoration: none; font-size: 13px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .site-nav a:hover { color: var(--accent); }
  @media (max-width: 640px) { .site-nav { display: none; } }

  /* ---------- hero ---------- */
  .hero { padding: 56px 0 48px; border-bottom: 1px solid var(--line); text-align: center; }
  .hero-grid { display: flex; flex-direction: column; align-items: center; }
  .hero h1 { overflow-wrap: break-word; }

  .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px;
  }
  .kicker::before, .kicker::after { content: ""; width: 48px; height: 1px; background: var(--accent); }

  .hero h1 {
    font-size: clamp(38px, 8.5vw, 92px);
    font-weight: 900; line-height: .95; letter-spacing: -.02em;
    text-transform: uppercase; margin: 0 0 18px;
  }
  .hero h1 span { display: block; }
  .hero .lede { max-width: 46ch; color: var(--muted); font-size: 17px; }

  .crest { width: 224px; height: 224px; margin-top: 36px; background: var(--surface); border: 1px solid var(--line-strong); padding: 10px; }
  .crest img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 820px) { .crest { width: 150px; height: 150px; } }

  .facts {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 1px solid var(--line-strong); margin-top: 48px;
  }
  .fact { padding: 18px 12px 4px; border-right: 1px solid var(--line); min-width: 0; text-align: center; }
  .fact:last-child { border-right: 0; }
  .fact dt {
    font-size: 11px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
  }
  .fact dd { font-size: clamp(17px, 2.2vw, 22px); font-weight: 700; font-feature-settings: "tnum"; margin-top: 2px; overflow-wrap: anywhere; }
  @media (max-width: 760px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fact { border-bottom: 1px solid var(--line); padding-bottom: 14px; } }

  /* ---------- sections ---------- */
  section { padding: 56px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 80px; }
  section:last-of-type { border-bottom: 0; }

  .section-head { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 28px; text-align: center; }
  .section-head .no {
    font-size: 13px; font-weight: 700; color: var(--accent);
    font-feature-settings: "tnum"; letter-spacing: .08em;
  }
  .section-head h2 {
    font-size: 13px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase;
  }
  .section-head::before, .section-head::after { content: ""; width: 48px; height: 1px; background: var(--line); }

  /* profile list */
  .dl { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 720px; margin-inline: auto; }
  .dl > div { display: contents; }
  .dl dt {
    font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); padding: 12px 0;
  }
  .dl dd { padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 500; overflow-wrap: anywhere; }
  .dl dt { border-bottom: 1px solid var(--line); }
  .dl div:last-child dt, .dl div:last-child dd { border-bottom: 0; }
  @media (max-width: 560px) { .dl { grid-template-columns: 1fr; } .dl dt { padding-bottom: 0; border-bottom: 0; } }

  /* achievements rows */
  .rows { border-top: 1px solid var(--line-strong); max-width: 760px; margin-inline: auto; }
  .row {
    display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 20px;
    padding: 16px 0; border-bottom: 1px solid var(--line);
  }
  .row .year {
    font-weight: 900; font-size: 20px; font-feature-settings: "tnum";
    letter-spacing: -.01em; line-height: 1.3;
  }
  .row .body { font-size: 15.5px; overflow-wrap: anywhere; }
  .row .body strong { font-weight: 700; }
  .row .body em { font-style: italic; color: var(--muted); }
  @media (max-width: 560px) { .row { grid-template-columns: 56px 1fr; gap: 12px; } .row .year { font-size: 16px; } }

  .aside {
    margin: 32px auto 0; padding: 20px 24px;
    border-left: 3px solid var(--accent); background: var(--surface);
    max-width: 720px;
  }
  .aside .aside-title {
    font-size: 12px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  .aside p { font-size: 15.5px; }
  .aside p + p { margin-top: 8px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-feature-settings: "tnum"; }
  caption { text-align: left; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line-strong);
  }
  tbody td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:hover td { background: rgba(23, 19, 16, .025); }
  td.num { font-weight: 700; white-space: nowrap; }
  td.season-year { font-weight: 900; font-size: 17px; }
  td .sub { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .table-scroll { overflow-x: auto; max-width: 900px; margin-inline: auto; -webkit-overflow-scrolling: touch; }

  /* links */
  .linklist { max-width: 720px; margin-inline: auto; border-top: 1px solid var(--line-strong); }
  .linklist a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    text-decoration: none; font-weight: 600; font-size: 15px; min-width: 0;
  }
  .linklist a span:first-child { min-width: 0; flex-shrink: 0; }
  .linklist a span:last-child {
    color: var(--muted); font-weight: 400; font-size: 13px;
    min-width: 0; overflow-wrap: anywhere; text-align: right;
  }
  .linklist a:hover span:first-child { color: var(--accent); }

  /* footer */
  footer { padding: 36px 0 56px; color: var(--muted); font-size: 13px; text-align: center; }
  footer .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #links p { text-align: center; }
  footer a { color: var(--ink); }
  footer a:hover { color: var(--accent); }

  .error {
    border: 1px solid var(--accent); border-left: 3px solid var(--accent);
    background: var(--surface); padding: 20px 24px; margin: 48px 0;
  }
  .skeleton { color: var(--muted); padding: 48px 0; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="#top">
      <img src="logo.png" alt="" onerror="this.style.display='none'" />
      Megiddo Lions
    </a>
    <nav class="site-nav" aria-label="Sections">
      <a href="#team">Team</a>
      <a href="#achievements">Record</a>
      <a href="#seasons">Seasons</a>
      <a href="#awards">Awards</a>
      <a href="#links">Links</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div>
          <p class="kicker">FIRST Tech Challenge · Israel</p>
          <h1><span>Megiddo</span><span>Lions</span></h1>
          <p class="lede" id="hero-lede">Loading team information…</p>
        </div>
        <div class="crest" aria-hidden="true">
          <img src="logo.png" alt="Megiddo Lions crest" onerror="this.parentElement.style.display='none'" />
        </div>
      </div>
      <dl class="facts" id="facts"></dl>
    </div>
  </div>

  <div id="content"><p class="skeleton">Loading data from DATA.md…</p></div>
</main>

<footer>
  <div class="wrap">
    <div>Team data: <a href="DATA.md">DATA.md</a> — regenerated weekly from FIRST's official event pages.</div>
    <div>Served by GitHub Pages · <span id="footer-updated"></span></div>
  </div>
</footer>

<script>
/* ============================================================
   Rendering layer. DATA.md is the single source of truth; the
   parser below must stay compatible with its section structure
   (see the agent instructions in DATA.md §1).
   ============================================================ */

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function mdInline(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function section(md, startHeading, nextHeadingRe) {
  const start = md.indexOf(startHeading);
  if (start === -1) return "";
  let rest = md.slice(start + startHeading.length);
  const lineEnd = rest.indexOf("\n"); // skip the remainder of the heading line
  if (lineEnd !== -1) rest = rest.slice(lineEnd + 1);
  if (nextHeadingRe) {
    const m = rest.match(nextHeadingRe);
    if (m) rest = rest.slice(0, m.index);
  }
  return rest;
}

function parseLiveBlock(md) {
  const m = md.match(/<!--\s*BEGIN LIVE TEAM DATA[\s\S]*?([\s\S]*?)<!--\s*END LIVE TEAM DATA/);
  if (!m) return null;
  const block = m[1];

  const identity = {};
  block.split("### Season history")[0].split("\n").forEach((line) => {
    const kv = line.match(/^([A-Za-z ]+):\s*(.+)$/);
    if (kv) identity[kv[1].trim()] = kv[2].trim();
  });

  const seasons = [];
  (block.split("### Season history")[1] || "").split(/^#### /m).slice(1).forEach((chunk) => {
    const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
    const head = lines[0].match(/^(\d{4})\s*[—-]\s*(.+)$/);
    const s = { year: head ? head[1] : "?", game: head ? head[2] : "?", record: null, ranks: [], awards: [] };
    lines.slice(1).forEach((line) => {
      let mm;
      if ((mm = line.match(/^Record:\s*(.+)$/))) s.record = mm[1];
      else if ((mm = line.match(/^Event:\s*(.+?)\s*[—-]\s*quals rank\s*(\d+)\s*of\s*(\d+)$/)))
        s.ranks.push({ event: mm[1], rank: +mm[2], of: +mm[3] });
      else if ((mm = line.match(/^Award:\s*(.+?)\s*[—-]\s*(.+)$/)))
        s.awards.push({ name: mm[1], event: mm[2] });
    });
    seasons.push(s);
  });
  return { identity, seasons };
}

function parseLinks(md) {
  const sec = section(md, "## 3. Logo links", /^## /m);
  const links = [];
  sec.split("\n").forEach((line) => {
    const cells = line.split("|").map((c) => c.trim());
    if (cells.length < 4 || /^-+$/.test(cells[1] || "-")) return;
    const linkMatch = (cells[2] || "").match(/\[([^\]]+)\]\((https?:[^)]+)\)/) || (cells[2] || "").match(/(https?:\S+)/);
    if (linkMatch && cells[1] !== "Source") links.push({ label: cells[1], url: linkMatch[2] || linkMatch[1] });
  });
  return links;
}

function parseAchievements(md) {
  const sec = section(md, "## 4. Achievements", /^## /m);
  const items = [];
  sec.split("\n").forEach((line) => {
    const t = line.trim();
    if (!t.startsWith("- ")) return;
    const mm = t.slice(2).match(/^\*\*(.+?)\*\*\s*(?:\*[^*]+\*)?\s*[—-]\s*(.+)$/); // **Title** *(optional note)* — text
    if (mm) {
      const y = mm[1].match(/^\d{4}/);
      items.push({ year: y ? y[0] : "", title: mm[1], text: mm[2] });
    } else if (items.length) items[items.length - 1].text += " " + t.slice(2);
  });
  return items;
}

function parseWorldChampAnswer(md) {
  // needle must match DATA.md's heading exactly (straight quotes)
  const sec = section(md, '### "Did they win the world championship?', /^## /m);
  return sec.split("\n").map((l) => l.trim()).filter(Boolean)
    .map(mdInline).join("</p><p>");
}

function bestFinish(season) {
  if (!season.ranks.length) return null;
  return season.ranks.reduce((a, b) => (b.rank / b.of < a.rank / a.of ? b : a));
}

function render(data, links, achievements, champAnswer) {
  const id = data.identity;
  const cur = data.seasons[0] || {};

  document.getElementById("hero-lede").textContent =
    [id["Organization"], id["Location"]].filter(Boolean).join(" — ");

  const facts = [
    ["Team", id["Number"]],
    ["Rookie year", id["Rookie year"]],
    ["Seasons played", data.seasons.length],
    ["Current season", cur.year ? `${cur.year} · ${cur.game}` : ""],
  ];
  document.getElementById("facts").innerHTML = facts
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");

  const totalAwards = data.seasons.reduce((n, s) => n + s.awards.length, 0);
  const totalEvents = data.seasons.reduce((n, s) => n + s.ranks.length, 0);

  const profile = `<section id="team">
    <div class="section-head"><span class="no">01</span><h2>Team</h2></div>
    <dl class="dl">
      <div><dt>Team number</dt><dd>${esc(id["Number"] || "")}</dd></div>
      <div><dt>Team name</dt><dd>${esc(id["Name"] || "")}</dd></div>
      <div><dt>Organization</dt><dd>${esc(id["Organization"] || "")}</dd></div>
      <div><dt>Location</dt><dd>${esc(id["Location"] || "")}</dd></div>
      <div><dt>Country</dt><dd>${esc(id["Country"] || "")}</dd></div>
      <div><dt>FIRST region</dt><dd>${esc(id["Region"] || "")}</dd></div>
      <div><dt>Rookie year</dt><dd>${esc(id["Rookie year"] || "")}</dd></div>
      <div><dt>Sponsors</dt><dd>${esc(id["Sponsors"] || "")}</dd></div>
    </dl>
  </section>`;

  const ach = achievements.length ? `<section id="achievements">
    <div class="section-head"><span class="no">02</span><h2>Record — season by season</h2></div>
    <div class="rows">
      ${achievements.map((a) =>
        `<div class="row"><div class="year">${esc(a.year)}</div><div class="body"><strong>${esc(a.title)}</strong> — ${mdInline(a.text)}</div></div>`).join("")}
    </div>
    ${champAnswer ? `<div class="aside"><div class="aside-title">Did they win the world championship?</div><p>${champAnswer}</p></div>` : ""}
  </section>` : "";

  const seasonRows = data.seasons.map((s) => {
    const best = bestFinish(s);
    const m = (s.record || "").match(/^(\d+)-(\d+)-(\d+)/);
    const rec = m ? `${m[1]}–${m[2]}–${m[3]}` : "—";
    return `<tr>
      <td class="season-year">${esc(s.year)}<span class="sub">${esc(s.game)}</span></td>
      <td class="num">${rec}</td>
      <td class="num">${s.ranks.length || "—"}</td>
      <td>${best ? `${best.rank} of ${best.of}<span class="sub">${esc(best.event)}</span>` : "—"}</td>
      <td class="num">${s.awards.length || "—"}</td>
    </tr>`;
  }).join("");

  const seasons = `<section id="seasons">
    <div class="section-head"><span class="no">03</span><h2>Seasons</h2></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Season</th><th>W–L–T</th><th>Events</th><th>Best qual. finish</th><th>Awards</th></tr></thead>
      <tbody>${seasonRows}</tbody>
    </table></div>
  </section>`;

  const awardRows = data.seasons.flatMap((s) =>
    s.awards.map((a) =>
      `<tr><td class="num">${esc(s.year)}</td><td>${esc(a.name)}</td><td>${esc(a.event)}</td></tr>`)).join("");

  const awards = awardRows ? `<section id="awards">
    <div class="section-head"><span class="no">04</span><h2>Awards — ${totalAwards} total</h2></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Season</th><th>Award</th><th>Event</th></tr></thead>
      <tbody>${awardRows}</tbody>
    </table></div>
  </section>` : "";

  const linkRows = links.map((l) =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}</span><span>${esc(l.url.replace(/^https?:\/\//, ""))}</span></a>`).join("");

  const linksHtml = links.length ? `<section id="links">
    <div class="section-head"><span class="no">05</span><h2>Official profiles</h2></div>
    <div class="linklist">${linkRows}</div>
    <p style="margin-top:16px;color:var(--muted);font-size:13px">
      ${totalEvents} official events with qualification results on record.
    </p>
  </section>` : "";

  document.getElementById("content").innerHTML = profile + ach + seasons + awards + linksHtml;

  const upd = id["Data updated"];
  if (upd) {
    document.getElementById("footer-updated").innerHTML =
      `Data current as of <a href="DATA.md">${esc(upd)}</a>`;
  }
}

async function main() {
  try {
    const res = await fetch("DATA.md", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const md = await res.text();

    const data = parseLiveBlock(md);
    if (!data || !data.identity["Number"]) throw new Error("Live team data block not found in DATA.md");

    render(data, parseLinks(md), parseAchievements(md), parseWorldChampAnswer(md));
  } catch (err) {
    document.getElementById("content").innerHTML =
      `<div class="error"><strong>Data could not be loaded.</strong><br>${esc(String(err.message || err))}<br><br>
       If you opened this file directly (file://), serve the folder instead:
       <code>python3 -m http.server 8000</code> → <code>http://localhost:8000</code></div>`;
  }
}
main();
</script>
</body>
</html>
